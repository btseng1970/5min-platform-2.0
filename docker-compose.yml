services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fivemin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fivemin}
      POSTGRES_DB: ${POSTGRES_DB:-fivemin_dev}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fivemin} -d ${POSTGRES_DB:-fivemin_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fivemin}:${POSTGRES_PASSWORD:-fivemin}@postgres:5432/${POSTGRES_DB:-fivemin_dev}

volumes:
  postgres_data:
